<div class="replies-section">
  <h3>{{'REPLIESFORM' | translate}}</h3>
  <div *ngFor="let reply of replies" class="reply-card">
    <p>{{ reply.content }}</p>
    <small>{{'BYREPLIESFORM' | translate}}: {{ reply.author }}</small>
  </div>

  <form [formGroup]="replyForm" (ngSubmit)="submitReply()">
    <div class="form-group">
      <label for="author">{{'NAME' | translate}}</label>
      <input id="author" formControlName="author" type="text" />
    </div>
    <div class="form-group">
      <label for="content">{{'REPLY_LABEL' | translate}}</label>
      <textarea id="content" formControlName="content"></textarea>
    </div>
    <button type="submit" [disabled]="replyForm.invalid">{{'ADD_REPLY' | translate}}</button>
  </form>
</div>
