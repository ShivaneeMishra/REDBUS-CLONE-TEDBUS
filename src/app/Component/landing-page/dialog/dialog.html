<h2 mat-dialog-title>{{'MODAL_TITLE_BUS_ROUTES'| translate}}</h2>
<mat-dialog-content class="mat-typography">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> {{'TABLE_HEADER_NO'| translate}}</th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="from">
      <th mat-header-cell *matHeaderCellDef> {{'FROM'| translate}} </th>
      <td mat-cell *matCellDef="let element"> {{element.from |translate}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="to">
      <th mat-header-cell *matHeaderCellDef> {{'TO'| translate}} </th>
      <td mat-cell *matCellDef="let element"> {{element.to |translate}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="nobus">
      <th mat-header-cell *matHeaderCellDef> {{'TABLE_HEADER_NO_OF_BUSES'| translate}} </th>
      <td mat-cell *matCellDef="let element"> {{element.nobus}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{'BTN_CANCEL'| translate}}</button>
</mat-dialog-actions>
